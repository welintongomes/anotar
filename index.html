<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#21242A">
<title>Memórias</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📑</text></svg>">
<style>
  :root{
    --bg:#21242A;
    --panel:#2A2E36;
    --panel-2:#2F343D;
    --steel:#3A3F49;
    --chalk:#EDEFF2;
    --smoke:#9AA0AB;
    --accent:#E8720C;
    --accent-ink:#241300;
    --info:#4FA8D8;
    --danger:#D64545;
    --font-display: 'Segoe UI Semibold','Roboto Condensed','Arial Narrow',Arial,sans-serif;
    --font-body: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.45;
    -webkit-tap-highlight-color:transparent;
  }
  button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit;}
  button{cursor:pointer;}
  h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}

  #app{max-width:900px;margin:0 auto;padding-bottom:112px;}

  /* ---------- Header (agora só informativo) ---------- */
  header#topbar{
    position:sticky;top:0;z-index:10;
    background:var(--bg);
    border-bottom:1px solid var(--steel);
    padding:16px 16px 12px;
  }
  header#topbar h1{font-size:21px;font-weight:700;}
  .tagline{margin:4px 0 0;color:var(--smoke);font-size:13.5px;}
  .result-count-label{margin:12px 16px 0;color:var(--smoke);font-size:13px;}

  .icon-btn{
    background:var(--panel);
    border:1px solid var(--steel);
    color:var(--chalk);
    width:44px;height:44px;min-width:44px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
  }
  .icon-btn:active{background:var(--panel-2);}

  .search-row{display:flex;gap:8px;flex-direction: row-reverse;}
  .search-wrap{
    flex:1;position:relative;display:flex;align-items:center;
    background:var(--panel-2);border:1px solid var(--steel);border-radius:10px;
  }
  .search-wrap span.search-ic{padding:0 0 0 12px;color:var(--smoke);font-size:17px;}
  #searchInput{
    flex:1;background:transparent;border:none;outline:none;
    padding:13px 8px;min-width:0;
  }
  #searchInput::placeholder{color:var(--smoke);}
  #btnClearSearch{
    background:transparent;border:none;color:var(--smoke);width:38px;height:38px;
    font-size:16px;display:none;align-items:center;justify-content:center;
  }
  .mic-btn.listening{
    background:var(--danger);border-color:var(--danger);color:#fff;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(214,69,69,0.55);}
    50%{box-shadow:0 0 0 8px rgba(214,69,69,0);}
  }

  /* ---------- Cards ---------- */
  main#cardsContainer{
    padding:10px 16px 16px;
    display:grid;grid-template-columns:1fr;gap:12px;
  }
  @media(min-width:640px){
    main#cardsContainer{grid-template-columns:1fr 1fr;}
  }
  .card{
    background:var(--panel);
    border:1px solid var(--steel);
    border-left:5px solid var(--tag-color,var(--info));
    border-radius:6px;
    padding:14px 14px 10px;
    display:flex;flex-direction:column;gap:6px;
  }
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .badge{
    border:1px solid currentColor;border-radius:5px;
    padding:2px 9px;font-size:12px;font-weight:600;
  }
  .photo-flag{font-size:13px;color:var(--smoke);margin-right:auto;margin-left:8px;}
  .star-btn{
    background:transparent;border:none;color:var(--smoke);font-size:22px;
    width:36px;height:36px;line-height:1;padding:0;
  }
  .star-btn.active{color:var(--accent);}
  .card-title{font-size:17px;font-weight:700;}
  .card-vehicle{margin:0;color:var(--smoke);font-size:13.5px;}
  .card-spec{margin:0;color:var(--info);font-weight:700;font-size:15.5px;}
  .card-snippet{
    margin:2px 0 0;color:var(--smoke);font-size:14px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tags-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;scrollbar-width: none;}
  .tag-pill{background:var(--panel-2);color:var(--smoke);border-radius:5px;padding:2px 8px;font-size:12px;}
  .card-footer{margin:6px 0 0;color:var(--smoke);font-size:12px;}

  #emptyState{
    display:none;text-align:center;color:var(--smoke);padding:40px 24px;font-size:15px;
  }

  /* ---------- Barra inferior (zona do polegar) ---------- */
  #bottomNav{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--panel);border-top:1px solid var(--steel);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav-inner{
    max-width:900px;margin:0 auto;
    display:flex;align-items:flex-end;justify-content:space-around;
    padding:6px 8px 8px;
  }
  .nav-btn{
    background:transparent;border:none;color:var(--smoke);
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 4px;min-width:58px;flex:1;border-radius:8px;
  }
  .nav-btn .nav-ic{font-size:22px;line-height:1;}
  .nav-btn .nav-label{font-size:11px;font-weight:600;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-btn.active{color:var(--accent);}
  .nav-btn:active{background:var(--panel-2);}
  .nav-add{
    flex:0 0 auto;width:58px;height:58px;border-radius:50%;
    background:var(--accent);color:var(--accent-ink);border:none;
    font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;
    margin:0 6px;transform:translateY(-16px);
    box-shadow:0 6px 16px rgba(0,0,0,0.45);
  }
  .nav-add:active{transform:translateY(-16px) scale(0.95);}

  /* ---------- Modais / gavetas (bottom sheets) ---------- */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(15,16,18,0.68);
    z-index:100;align-items:flex-end;justify-content:center;padding:0;
    opacity:0;transition:opacity .2s ease;
  }
  .modal-overlay.open{opacity:1;}
  .modal-box{
    background:var(--panel);border:1px solid var(--steel);
    border-radius:16px 16px 0 0;
    width:100%;max-width:640px;max-height:85vh;overflow-y:auto;
    display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .25s ease;
  }
  .modal-overlay.open .modal-box{transform:translateY(0);}
  @media(min-width:640px){
    .modal-overlay{align-items:center;padding:14px;}
    .modal-box{border-radius:14px;transform:translateY(24px); scrollbar-color: rgb(139 139 139) rgba(255, 255, 255, .05); scrollbar-width: thin;}
  }
  .modal-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;border-bottom:1px solid var(--steel);
    position:sticky;top:0;background:var(--panel);z-index:2;
  }
  .modal-header h2{font-size:19px;}
  .modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px;}
  .modal-footer{
    padding:14px 18px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--steel);
    display:flex;gap:10px;flex-wrap:wrap;
  }

  label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--smoke);font-weight:600;}
  .req{color:var(--danger);margin-left:3px;}
  input[type=text],select,textarea{
    background:var(--panel-2);border:1px solid var(--steel);border-radius:8px;
    padding:12px;color:var(--chalk);font-weight:400;width:100%;
  }
  textarea{resize:vertical;min-height:90px;}
  input[type=text]:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;}
  .textarea-wrap{position:relative;}
  .textarea-wrap textarea{padding-left:50px;}
  .textarea-wrap .mic-btn{position:absolute;left:6px;bottom:6px;width:38px;height:38px;min-width:38px;}
  /* Área do input de arquivo (fundo) */
  input[type=file] {
    background: var(--panel-2);
    border: 1px dashed var(--smoke); /* Borda tracejada dá um ar de app moderno */
    border-radius: 8px;
    padding: 8px;
    color: var(--smoke);
    width: 100%;
    cursor: pointer;
    font-size: 14px;
  }

  /* A mágica que transforma o botão "1999" em um botão moderno */
  input[type=file]::file-selector-button {
    background: var(--steel);
    border: none;
    color: var(--chalk);
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    margin-right: 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: background 0.2s ease;
  }

  /* Efeito ao clicar no botão */
  input[type=file]::file-selector-button:active {
    background: var(--panel);
  }
  .checkbox-row{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--chalk);}
  .checkbox-row input{width:20px;height:20px;}

  #photoPreviewWrap{display:none;flex-direction:column;gap:8px;}
  #photoPreview{width:100%;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid var(--steel);}

  .btn-primary,.btn-secondary,.btn-danger{
    border-radius:8px;padding:13px 18px;font-weight:700;font-size:15px;border:none;min-height:48px;flex:1;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-secondary{background:var(--panel-2);color:var(--chalk);border:1px solid var(--steel);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .view-footer{flex-wrap:wrap;}

  .spec-big{color:var(--info);font-weight:700;font-size:22px;margin:0;}
  .content-block{ overflow-y: auto; max-height: 38vh;scrollbar-width: thin; scrollbar-color: rgb(139 139 139) rgba(255, 255, 255, .05); white-space:pre-wrap;word-wrap:break-word;line-height:1.6;margin:0;}
  .meta-line{margin:0;color:var(--smoke);font-size:14px;}
  .view-meta-footer{color:var(--smoke);font-size:13px;margin-top:6px;}
  .view-photo{width:100%;border-radius:8px;border:1px solid var(--steel);margin:4px 0;}

  .category-row{
    display:flex;align-items:center;gap:12px;width:100%;
    background:transparent;border:none;border-bottom:1px solid var(--steel);
    color:var(--chalk);padding:14px 4px;text-align:left;font-size:15px;
  }
  .category-row:last-child{border-bottom:none;}
  .category-row.selected{color:var(--accent);font-weight:700;}
  .cat-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
  .cat-count{margin-left:auto;color:var(--smoke);font-size:13px;font-weight:400;}

  hr{border:none;border-top:1px solid var(--steel);width:100%;margin:0;}

  #toast{
    position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);
    background:var(--panel-2);border:1px solid var(--steel);color:var(--chalk);
    padding:12px 18px;border-radius:9px;font-size:14.5px;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    z-index:200;max-width:90vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}

  @media (prefers-reduced-motion:reduce){
    .modal-overlay,.modal-box{transition:none;}
    .mic-btn.listening{animation:none;}
    #toast{transition:none;}
  }
  @media(max-width:640px){
    .modal-box{border-radius:16px;margin-bottom: 75px;}
  }
  mark {
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 3px;
    padding: 0 3px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>📝 Memórias</h1>
    <p class="tagline">Anote uma vez. Ache na hora.</p>
  </header>

  <p id="resultCount" class="result-count-label"></p>
  <main id="cardsContainer"></main>
  <p id="emptyState"></p>
</div>

<!-- Barra inferior fixa -->
<nav id="bottomNav">
  <div class="bottom-nav-inner">
    <button id="navSearch" class="nav-btn" aria-label="Buscar">
      <span class="nav-ic">🔍</span><span class="nav-label">Buscar</span>
    </button>
    <button id="navCategory" class="nav-btn" aria-label="Categorias">
      <span class="nav-ic">🏷️</span><span class="nav-label" id="navCategoryLabel">Categorias</span>
    </button>
    <button id="btnAdd" class="nav-add" aria-label="Adicionar novo registro" title="Adicionar novo registro">+</button>
    <button id="navFav" class="nav-btn" aria-label="Favoritos">
      <span class="nav-ic">⭐</span><span class="nav-label">Favoritos</span>
    </button>
    <button id="navMore" class="nav-btn" aria-label="Mais opções">
      <span class="nav-ic">⋮</span><span class="nav-label">Mais</span>
    </button>
  </div>
</nav>

<!-- Gaveta: buscar -->
<div id="sheetSearch" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Buscar</h2>
      <button class="icon-btn" id="btnCloseSearch" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-body">
      <div class="search-row">
        <div class="search-wrap">
          <span class="search-ic">🔍</span>
          <input type="text" id="searchInput" placeholder="Título, assunto, tag, conteúdo..." autocomplete="off">
          <button id="btnClearSearch" aria-label="Limpar busca">✕</button>
        </div>
        <button id="btnMic" class="icon-btn mic-btn" aria-label="Buscar falando" title="Buscar falando">🎤</button>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-primary" id="btnApplySearch">Ver <span id="searchResultCount">0</span> resultado(s)</button>
    </div>
  </div>
</div>

<!-- Gaveta: categorias -->
<div id="sheetCategory" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Categorias</h2>
      <button class="icon-btn" id="btnCloseCategory" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-body" id="categoryList"></div>
  </div>
</div>

<!-- Gaveta: formulário (adicionar/editar) -->
<div id="modalForm" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="formTitle">Novo registro</h2>
      <button class="icon-btn" id="btnCloseForm" aria-label="Fechar">✕</button>
    </div>
    <form id="itemForm">
      <div class="modal-body">
        <label>Título<span class="req"></span>
          <input type="text" id="fieldTitle" placeholder="Ex.: Ideia de projeto, Wi-Fi, Medida da sala" maxlength="120">
        </label>

        <label>O que você quer lembrar
  <div style="display:flex; gap:8px; margin-bottom:6px; flex-wrap:wrap;">
  <button type="button" id="btnInsertCheckbox" class="tag-pill" style="border:none; cursor:pointer;">☑️ check [ ]</button>
  <button type="button" id="btnInsertArrow" class="tag-pill" style="border:none; cursor:pointer;">➡️ fluxo >></button>
  <button type="button" id="btnInsertDivider" class="tag-pill" style="border:none; cursor:pointer;">➖ separador</button>
  <button type="button" id="btnInsertQuiz" class="tag-pill" style="border:none; cursor:pointer;">🧠 quiz</button>
  <button type="button" id="btnInsertLink" class="tag-pill" style="border:none; cursor:pointer; background:#4FA8D8; color:#fff;">🔗 link</button>
</div>
  <div class="textarea-wrap">
    <textarea id="fieldContent" rows="5" placeholder="Explique com suas palavras: qual era o problema, o que resolveu, o passo a passo, onde fica a peça..."></textarea>
    <button type="button" id="btnMicContent" class="icon-btn mic-btn" aria-label="Ditar em voz alta" title="Ditar em voz alta">🎤</button>
  </div>
</label>
        
        <label>Foto (opcional)
          <input type="file" accept="image/*" capture="environment" id="fieldPhoto">
        </label>
        <div id="photoPreviewWrap">
          <img id="photoPreview" alt="Prévia da foto">
          <button type="button" id="btnRemovePhoto" class="btn-secondary">Remover foto</button>
        </div>
        <label>Áudio (opcional)
        <input type="file" accept="audio/*" capture="microphone" id="fieldAudio">
      </label>
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
        <button type="button" id="btnRecordAudio" class="btn-secondary">🎙️ Gravar áudio pelo microfone</button>
        <span id="recordingTimer" style="display:none; font-weight:bold; color:#D64545;">● 00:00</span>
      </div>
        <div id="audioPreviewWrap" style="display:none; flex-direction:column; gap:8px; margin-bottom:12px;">
          <audio id="audioPreview" controls style="width:100%;"></audio>
          <button type="button" id="btnRemoveAudio" class="btn-secondary">Remover áudio</button>
        </div>
        <label>Palavras-chave para achar depois (separe por vírgula)
          <input type="text" id="fieldTags" placeholder="Ex.: motor, ignição, sensor">
        </label>
        <label>Categoria
          <select id="fieldCategory"></select>
        </label>
        <input type="text" id="fieldCategoryCustom" placeholder="Nome da nova categoria" style="display:none">
        
        <label>📌 Subtítulo ou Referência (opcional)
          <input type="text" id="fieldVehicle" placeholder="Ex.: Cliente X, Projeto Site, Banco">
        </label>

        <label>Valor, Quantidade ou Especificação (opcional)
          <input type="text" id="fieldSpec" placeholder="Ex.: R$ 150,00 / 220V / 5 litros">
        </label>

        <label class="checkbox-row"><input type="checkbox" id="fieldFavorite"> Favoritar ⭐ (aparece sempre no topo)</label>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn-primary" id="btnSave">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Gaveta: visualizar detalhes -->
<div id="modalView" class="modal-overlay">
  <div class="modal-box">
<div class="modal-header" style="justify-content: space-between; display: flex; align-items: center; width: 100%;">
      <div style="display:flex; align-items:center; gap:8px; overflow:hidden;">
        <button class="icon-btn" id="btnBackView" style="display:none; font-size:22px; padding:0; margin:0;" aria-label="Voltar">⬅️</button>
        <h2 id="viewTitle" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></h2>
      </div>
      <button class="icon-btn" id="btnCloseView" aria-label="Fechar">✕</button>
    </div>
    
    <div class="modal-body" id="viewBody"></div>
    <div class="modal-footer view-footer">
      <button id="btnEdit" class="btn-secondary">Editar</button>
      <button id="btnDuplicate" class="btn-secondary">Duplicar</button>
      <button id="btnDelete" class="btn-danger">Excluir</button>
    </div>
    <div id="internalSearchWrap" style="display:none; z-index: 3; bottom: 0; position: sticky; gap:8px; padding:10px 16px; background:var(--panel-2); border-bottom:1px solid var(--smoke); align-items:center;">
      <div style="flex:1; display:flex; align-items:center; position:relative; background:var(--bg); border-radius:6px;">
        <input type="text" id="internalSearchInput" placeholder="Buscar nesta nota..." autocomplete="off" style="flex:1; padding:8px 36px 8px 12px; border:none; background:transparent; color:var(--text); font-size:15px; outline:none;">
        <button type="button" id="btnClearInternalSearch" aria-label="Limpar busca interna" style="background:transparent; border:none; color:var(--smoke); width:36px; height:36px; font-size:16px; display:none; align-items:center; justify-content:center; position:absolute; right:0; cursor:pointer;">✕</button>
      </div>
      <span id="internalSearchCount" style="font-size:0.85em; opacity:0.7; white-space:nowrap; min-width:35px; text-align:center;">0/0</span>
      <button type="button" id="btnInternalPrev" class="icon-btn" style="width:34px;height:34px;background:var(--bg);border-radius:6px; font-size:16px;">🔼</button>
      <button type="button" id="btnInternalNext" class="icon-btn" style="width:34px;height:34px;background:var(--bg);border-radius:6px; font-size:16px;">🔽</button>
    </div>
  </div>
</div>

<!-- Gaveta: mais opções (ordenar + backup) -->
<div id="sheetMore" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Mais opções</h2>
      <button class="icon-btn" id="btnCloseMore" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-body">
      <p class="meta-line" id="quizDueText"></p>
      <p class="meta-line" id="statsText"></p>
      <hr>
      <p class="meta-line" id="budgetSummaryText"></p>
      <button id="btnCopyGlobalBudget" class="btn-secondary">📋 Copiar orçamento global</button>
      <button id="btnSendBudget" class="btn-primary">📲 Enviar orçamento por WhatsApp</button>
      <button id="btnClearBudget" class="btn-danger">🗑️ Limpar todos os itens de orçamento</button>
      <p class="meta-line">faça backup regularmente para guardar o arquivo.</p>
      <hr>
      <p class="meta-line"></p>
      <label style="display:flex; flex-direction:column; gap:8px; margin-bottom: 12px; padding: 10px; background: var(--panel-2); border-radius: 8px;">
        <span>🏃‍♂️ Velocidade da Voz: <strong id="speedLabel">Normal (0.95x)</strong></span>
        <input type="range" id="voiceSpeed" min="0.5" max="2.0" step="0.05" value="0.95">
      </label>

/* ---------------- IndexedDB ---------------- */
const DB_NAME = 'minhasMemoriasDB';
const DB_VERSION = 1;
const STORE = 'items';

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const store = db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        store.createIndex('category', 'category', { unique:false });
        store.createIndex('favorite', 'favorite', { unique:false });
        store.createIndex('updatedAt', 'updatedAt', { unique:false });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}
const dbPromise = openDB();

function dbAdd(item){
  return dbPromise.then(db => new Promise((resolve,reject) => {
    const tx = db.transaction(STORE,'readwrite');
    const req = tx.objectStore(STORE).add(item);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function dbPut(item){
  return dbPromise.then(db => new Promise((resolve,reject) => {
    const tx = db.transaction(STORE,'readwrite');
    const req = tx.objectStore(STORE).put(item);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function dbDelete(id){
  return dbPromise.then(db => new Promise((resolve,reject) => {
    const tx = db.transaction(STORE,'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}
function dbGetAll(){
  return dbPromise.then(db => new Promise((resolve,reject) => {
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function dbGet(id){
  return dbPromise.then(db => new Promise((resolve,reject) => {
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function dbGetAllLight(){
  return dbPromise.then(db => new Promise((resolve,reject) => {
    const tx = db.transaction(STORE,'readonly');
    const store = tx.objectStore(STORE);
    const req = store.openCursor();
    const results = [];
    req.onsuccess = (e) => {
      const cursor = e.target.result;
      if(cursor) {
        const item = cursor.value;
        if (item.photo) {
          item.hasPhoto = true; 
          delete item.photo;    
        }
        if (item.audio) {
          item.hasAudio = true;
          delete item.audio;
        }
        results.push(item);
        cursor.continue();
      } else {
        resolve(results);
      }
    };
    req.onerror = () => reject(req.error);
  }));
}

async function toggleRecording(){
  if (mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop(); return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    showToast('Seu navegador não permite gravar pelo microfone.'); return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    let mimeType = 'audio/webm';
    if (window.MediaRecorder.isTypeSupported && !MediaRecorder.isTypeSupported(mimeType)){
      mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
    }
    recordedChunks = [];
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordingInterval);
      recordingTimer.style.display = 'none';
      btnRecordAudio.textContent = '🎙️ Gravar áudio pelo microfone';
      btnRecordAudio.style.background = '';
      if (recordedChunks.length){
        currentAudioBlob = new Blob(recordedChunks, { type: mimeType || 'audio/webm' });
        fieldAudio.value = ''; updateAudioPreview();
      }
    };
    mediaRecorder.start();
    let seconds = 0;
    recordingTimer.style.display = 'inline';
    recordingTimer.textContent = '● 00:00';
    btnRecordAudio.textContent = '⏹️ Parar gravação';
    btnRecordAudio.style.background = '#D64545';
    recordingInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds/60)).padStart(2,'0');
      const s = String(seconds%60).padStart(2,'0');
      recordingTimer.textContent = `● ${m}:${s}`;
    }, 1000);
  } catch(err){
    showToast('Não foi possível acessar o microfone.');
  }
}
function normalize(s){ return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function debounce(fn, delay){ let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); }; }
function insertAtCursor(textarea, textToInsert){
  const start = textarea.selectionStart ?? textarea.value.length;
  const end = textarea.selectionEnd ?? textarea.value.length;
  const before = textarea.value.slice(0, start);
  const after = textarea.value.slice(end);
  textarea.value = before + textToInsert + after;
  const newPos = start + textToInsert.length;
  textarea.focus();
  textarea.setSelectionRange(newPos, newPos);
  textarea.dispatchEvent(new Event('input'));
}
function showToast(msg){
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
}
function timeAgo(ts){
  if (!ts) return 'agora';
  const diff = Date.now() - ts;
  const min=60000, hour=3600000, day=86400000;
  if (diff < min) return 'agora mesmo';
  if (diff < hour) return `há ${Math.max(1,Math.floor(diff/min))} min`;
  if (diff < day) return `há ${Math.floor(diff/hour)}h`;
  const days = Math.floor(diff/day);
  if (days < 30) return days===1 ? 'há 1 dia' : `há ${days} dias`;
  const months = Math.floor(days/30);
  if (months < 12) return months===1 ? 'há 1 mês' : `há ${months} meses`;
  const years = Math.floor(months/12);
  return years===1 ? 'há 1 ano' : `há ${years} anos`;
}
function categoryColor(cat){
  if (CATEGORY_COLORS[cat]) return CATEGORY_COLORS[cat];
  let hash = 0;
  for (let i=0;i<cat.length;i++){ hash = cat.charCodeAt(i) + ((hash<<5)-hash); }
  const hue = Math.abs(hash) % 360; return `hsl(${hue}, 55%, 58%)`;
}
function blobToDataURL(blob){
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject; reader.readAsDataURL(blob);
  });
}
function dataURLToBlob(dataUrl){ return fetch(dataUrl).then(res => res.blob()); }
function compressImage(file, maxWidth = 1200, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader(); reader.readAsDataURL(file);
    reader.onload = event => {
      const img = new Image(); img.src = event.target.result;
      img.onload = () => {
        let width = img.width; let height = img.height;
        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
        const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('Erro ao carregar imagem.'));
    };
    reader.onerror = error => reject(error);
  });
}
function escapeHTML(str) {
  return (str || '').toString().replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag])).replace(/\r?\n/g, '<br>'); 
}
function stripFlowSuffix(text){
  const idx = (text||'').indexOf('>>');
  return idx === -1 ? text : text.slice(0, idx);
}
function sm2Update(prev, correct){
  const quality = correct ? 5 : 1; 
  let ef = (prev && typeof prev.ef === 'number') ? prev.ef : 2.5;
  let reps = (prev && typeof prev.reps === 'number') ? prev.reps : 0;
  let interval = (prev && typeof prev.interval === 'number') ? prev.interval : 0;
  if (quality < 3){ reps = 0; interval = 1; } 
  else {
    if (reps === 0) interval = 1;
    else if (reps === 1) interval = 6;
    else interval = Math.round(interval * ef);
    reps += 1;
  }
  ef = ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  if (ef < 1.3) ef = 1.3;
  return { chosen: null, ef, reps, interval, dueAt: Date.now() + interval * 24 * 60 * 60 * 1000, answeredAt: Date.now() };
}
function normalizeQuizRecord(raw){
  if (raw === undefined || raw === null) return null;
  if (typeof raw === 'number'){ return { chosen: raw, ef: 2.5, reps: 0, interval: 0, dueAt: 0 }; }
  return raw;
}
function isRecordDue(record){ return !!record && Date.now() >= record.dueAt; }
function getGlobalQuizStatus(){
  let due = 0, novas = 0;
  allItems.forEach(it => {
    if (!it.content) return;
    it.content.split('\n').forEach((line, idx) => {
      if (!/^\?\?/.test(line)) return;
      const record = normalizeQuizRecord((it.quizAnswers || {})[idx]);
      if (!record) novas++;
      else if (isRecordDue(record)) due++;
    });
  });
  return { due, novas };
}
function createFuzzyRegex(word) {
  return word
    .replace(/[aáàãâä]/gi, '[aáàãâä]').replace(/[eéèêë]/gi, '[eéèêë]')
    .replace(/[iíìîï]/gi, '[iíìîï]').replace(/[oóòõôö]/gi, '[oóòõôö]')
    .replace(/[uúùûü]/gi, '[uúùûü]').replace(/[cç]/gi, '[cç]');
}
function highlightHTML(text, query) {
  if (!text) return '';
  let safeText = escapeHTML(text);
  const q = (query || '').trim();
  if (!q) return safeText;
  const stopWords = ['o','a','os','as','um','uma','de','do','da','dos','das','em','no','na','nos','nas','para','por','com','e','ou'];
  const rawWords = q.split(' ').filter(Boolean);
  let phrasesToHighlight = [];
  if (rawWords.length > 1) { phrasesToHighlight.push(rawWords.join(' ')); }
  const meaningfulWords = rawWords.filter(w => !stopWords.includes(normalize(w)));
  phrasesToHighlight = phrasesToHighlight.concat(meaningfulWords);
  if (phrasesToHighlight.length === 0) return safeText;
  const wordsToRegex = [...new Set(phrasesToHighlight)]
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')) 
    .map(w => createFuzzyRegex(w)) 
    .sort((a, b) => b.length - a.length); 
  if (wordsToRegex.length > 0) {
    const regex = new RegExp(`(${wordsToRegex.join('|')})`, 'gi');
    safeText = safeText.replace(regex, '<mark>$1</mark>');
  }
  return safeText;
}
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
function startVoiceInput(targetEl, button, appendMode){
  if (!SpeechRecognitionAPI){ showToast('Busca por voz não é compatível.'); return; }
  const rec = new SpeechRecognitionAPI();
  rec.lang = 'pt-BR'; rec.interimResults = false; rec.maxAlternatives = 1;
  button.classList.add('listening');
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    if (appendMode){ targetEl.value = (targetEl.value ? targetEl.value.trim() + ' ' : '') + text; } 
    else { targetEl.value = text; targetEl.dispatchEvent(new Event('input')); }
  };
  rec.onerror = () => { button.classList.remove('listening'); };
  rec.onend = () => { button.classList.remove('listening'); };
  try { rec.start(); } catch(err){ button.classList.remove('listening'); }
}

function getSearchIndex(item){
  if (!item._searchIndex || item._searchIndexAt !== item.updatedAt){
    item._searchIndex = {
      nTitle: normalize(item.title), nVehicle: normalize(item.vehicle),
      nSpec: normalize(item.spec), nContent: normalize(item.content),
      nTags: normalize((item.tags||[]).join(' ')), nCategory: normalize(item.category)
    };
    item._searchIndexAt = item.updatedAt;
  }
  return item._searchIndex;
}
function scoreMatch(item, q) {
  let score = 0;
  const { nTitle, nVehicle, nSpec, nContent, nTags, nCategory } = getSearchIndex(item);
  const allText = `${nTitle} ${nVehicle} ${nSpec} ${nContent} ${nTags} ${nCategory}`;
  const stopWords = ['o','a','os','as','um','uma','de','do','da','dos','das','em','no','na','nos','nas','para','por','com','e','ou'];
  const rawWords = q.split(' ').filter(w => w.trim() !== '');
  const words = rawWords.filter(w => !stopWords.includes(w));
  if (words.length === 0) return 0; 

  for (const word of words) { if (!allText.includes(word)) return 0; }
  for (const word of words) {
    if (nTitle.includes(word)) score += 5;
    if (nTags.includes(word)) score += 4;
    if (nVehicle.includes(word)) score += 3;
    if (nSpec.includes(word)) score += 3;
    if (nCategory.includes(word)) score += 2;
    if (nContent.includes(word)) score += 1;
  }
  if (rawWords.length > 1) {
    const exactPhrase = rawWords.join(' ');
    if (allText.includes(exactPhrase)) {
      score += 15; 
      if (nTitle.includes(exactPhrase)) score += 10; 
    }
  }
  return score;
}
function getFilteredSorted(){
  let items = allItems.slice();
  if (currentCategory === 'Favoritos'){ items = items.filter(i => i.favorite); } 
  else if (currentCategory !== 'Todos'){ items = items.filter(i => i.category === currentCategory); }
  const q = normalize(currentSearch.trim());
  if (q){
    return items.map(i => ({ item:i, score: scoreMatch(i,q) }))
      .filter(x => x.score > 0)
      .sort((a,b) => (b.score - a.score) || ((b.item.favorite?1:0) - (a.item.favorite?1:0)) || (b.item.updatedAt - a.item.updatedAt))
      .map(x => x.item);
  }
  items.sort((a,b) => {
    const favA = a.favorite ? 1 : 0, favB = b.favorite ? 1 : 0;
    if (favA !== favB) return favB - favA;
    if (currentSort === 'usados') return (b.useCount||0) - (a.useCount||0);
    if (currentSort === 'az') return a.title.localeCompare(b.title,'pt-BR');
    return (b.updatedAt||0) - (a.updatedAt||0);
  });
  return items;
}

}

function getGlobalBudgetData(){
  const list = []; let total = 0;
  allItems.forEach(item => {
    if (!item.content) return;
    item.content.split('\n').forEach(line => {
      const m = line.match(/^\[[xX]\](.*)/); if (!m) return;
      const textPart = stripFlowSuffix(m[1]).trim();
      const nums = textPart.match(/\d+(?:[.,]\d+)?/g); if (!nums || !nums.length) return;
      const price = parseFloat(nums[nums.length - 1].replace(',', '.'));
      if (price > 0){ list.push({ itemId: item.id, itemTitle: item.title, text: textPart, price }); total += price; }
    });
  });
  return { list, total };
}
function refreshBudgetSummary(){
  const { list, total } = getGlobalBudgetData();
  if (!list.length){
    budgetSummaryText.textContent = 'Nenhum item de orçamento marcado no momento.';
    btnSendBudget.disabled = true; btnClearBudget.disabled = true;
  } else {
    budgetSummaryText.textContent = `Orçamento atual: ${list.length} item(ns) — R$ ${total.toFixed(2).replace('.', ',')}`;
    btnSendBudget.disabled = false; btnClearBudget.disabled = false;
  }
}
async function clearAllBudgetCheckboxes(){
  const { list } = getGlobalBudgetData();
  const affectedIds = [...new Set(list.map(i => i.itemId))];
  for (const id of affectedIds){
    const full = await dbGet(id);
    if (!full || !full.content) continue;
    const lines = full.content.split('\n').map(line => {
      const m = line.match(/^\[[xX]\](.*)/); if (!m) return line;
      const visible = stripFlowSuffix(m[1]);
      const nums = visible.match(/\d+(?:[.,]\d+)?/g);
      const hasPrice = nums && nums.length && parseFloat(nums[nums.length-1].replace(',','.')) > 0;
      return hasPrice ? ('[ ]' + m[1]) : line;
    });
    full.content = lines.join('\n'); full.updatedAt = Date.now();
    await dbPut(full);
    const ram = allItems.find(i => i.id === id);
    if (ram){ ram.content = full.content; ram.updatedAt = full.updatedAt; }
  }
  return affectedIds;
}

// Função super limpa que pega os itens brutos do banco e insere 1 a 1 para o Importar
async function processCartridgeItems(itemsList) {
  let count = 0;
  for (const raw of itemsList){
    const newItem = {
      title: raw.title || 'Sem título', category: raw.category || 'Nota geral', vehicle: raw.vehicle || '', spec: raw.spec || '',
      content: raw.content || '', tags: raw.tags || [], favorite: !!raw.favorite, useCount: raw.useCount || 0,
      createdAt: raw.createdAt || Date.now(), updatedAt: raw.updatedAt || Date.now(), photo: null, audio: null, quizAnswers: raw.quizAnswers || {}
    };
    if (raw.photoBase64){ try { newItem.photo = await dataURLToBlob(raw.photoBase64); } catch(e){} }
    if (raw.audioBase64){ try { newItem.audio = await dataURLToBlob(raw.audioBase64); } catch(e){} }
    try { await dbAdd(newItem); count++; } catch(e){}
  }
  return count;
}

    insertAtCursor(fieldContent, (atLineStart ? '' : '\n') + '----\n');
  });
  
  btnInsertQuiz.addEventListener('mousedown', (e) => e.preventDefault());
  btnInsertQuiz.addEventListener('click', () => {
    const start = fieldContent.selectionStart ?? fieldContent.value.length; const end = fieldContent.selectionEnd ?? start;
    const value = fieldContent.value; const atLineStart = start === 0 || value[start - 1] === '\n';
    const prefix = (atLineStart ? '' : '\n') + '?? '; const placeholder = 'Pergunta';
    const rest = placeholder + '\n() Opção 1\n() Opção 2\n(x) Opção correta\n';
    fieldContent.value = value.slice(0, start) + prefix + rest + value.slice(end);
    const selStart = start + prefix.length; fieldContent.focus(); fieldContent.setSelectionRange(selStart, selStart + placeholder.length); fieldContent.dispatchEvent(new Event('input'));
  });

  btnInsertLink.addEventListener('mousedown', (e) => { e.preventDefault(); });
  btnInsertLink.addEventListener('click', () => {
    const start = fieldContent.selectionStart ?? fieldContent.value.length; const end = fieldContent.selectionEnd ?? start;
    const value = fieldContent.value; const textToWrap = value.substring(start, end) || "Nome da Nota Aqui";
    const linkStr = `[[${textToWrap}]]`;
    fieldContent.value = value.slice(0, start) + linkStr + value.slice(end);
    const newCursorPos = start + 2; fieldContent.focus(); fieldContent.setSelectionRange(newCursorPos, newCursorPos + textToWrap.length); fieldContent.dispatchEvent(new Event('input'));
  });

  sortSelect.addEventListener('change', () => { currentSort = sortSelect.value; renderCards(); });

  navSearch.addEventListener('click', () => { openSheet(sheetSearch); setTimeout(() => searchInput.focus(), 260); });
  btnCloseSearch.addEventListener('click', () => closeSheetEl(sheetSearch));
  btnApplySearch.addEventListener('click', () => closeSheetEl(sheetSearch));
  sheetSearch.addEventListener('click', (e) => { if (e.target === sheetSearch) closeSheetEl(sheetSearch); });

  navCategory.addEventListener('click', () => { renderCategoryList(); openSheet(sheetCategory); });
  btnCloseCategory.addEventListener('click', () => closeSheetEl(sheetCategory));
  sheetCategory.addEventListener('click', (e) => { if (e.target === sheetCategory) closeSheetEl(sheetCategory); });

  navFav.addEventListener('click', () => { currentCategory = currentCategory === 'Favoritos' ? 'Todos' : 'Favoritos'; renderCategoryList(); renderCards(); });

  btnAdd.addEventListener('click', () => openForm(null, 'add'));

  fieldCategory.addEventListener('change', () => {
    const isCustom = fieldCategory.value === '__custom__'; fieldCategoryCustom.style.display = isCustom ? 'block' : 'none';
    if (isCustom) fieldCategoryCustom.focus();
  });
  
  btnRemovePhoto.addEventListener('click', () => { currentPhotoBlob = null; fieldPhoto.value = ''; updatePhotoPreview(); });
  fieldPhoto.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (file) {
      showToast('Comprimindo foto...');
      try { currentPhotoBlob = await compressImage(file); updatePhotoPreview(); } catch (error) { showToast('Erro ao processar foto.'); }
    }
  });

  itemForm.addEventListener('submit', (e) => { e.preventDefault(); handleSave(); });
  btnCloseForm.addEventListener('click', closeForm);
  modalForm.addEventListener('click', (e) => { if (e.target === modalForm) closeForm(); });

  btnCloseView.addEventListener('click', closeView);
  modalView.addEventListener('click', (e) => { if (e.target === modalView) closeView(); });

  btnEdit.addEventListener('click', () => { const item = viewingItem; closeView(); openForm(item, 'edit'); });
  btnDuplicate.addEventListener('click', () => { const item = viewingItem; closeView(); openForm(item, 'duplicate'); });
  btnDelete.addEventListener('click', () => {
    const item = viewingItem; if (!item) return;
    if (!confirm(`Excluir "${item.title}"?`)) return;
    dbDelete(item.id).then(() => { closeView(); showToast('Excluído.'); loadAndRender(); });
  });

  navMore.addEventListener('click', async () => {
    const { due: nDue, novas: nNovas } = getGlobalQuizStatus(); let partes = [];
    if (nDue > 0) partes.push(`⏰ ${nDue} vencida(s) pra revisar`);
    if (nNovas > 0) partes.push(`🆕 ${nNovas} nova(s) esperando resposta`);
    quizDueText.textContent = partes.length ? '🧠 ' + partes.join(' · ') : 'Nenhuma pergunta de quiz pendente agora.';
    const items = await dbGetAll();
    statsText.textContent = items.length === 1 ? '1 registro salvo neste navegador.' : `${items.length} registros salvos neste navegador.`;
    refreshBudgetSummary(); openSheet(sheetMore);
  });
  btnCloseMore.addEventListener('click', () => closeSheetEl(sheetMore));
  sheetMore.addEventListener('click', (e) => { if (e.target === sheetMore) closeSheetEl(sheetMore); });

  btnSendBudget.addEventListener('click', () => {
    const { list, total } = getGlobalBudgetData(); if (!list.length) return;
    const desc = list.map(i => `✅ ${i.text} (${i.itemTitle})`);
    const msg = `*Orçamento*\n\n${desc.join('\n')}\n\n*Total: R$ ${total.toFixed(2).replace('.', ',')}*`;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  });
  
  btnCopyGlobalBudget.addEventListener('click', () => {
    const { list, total } = getGlobalBudgetData(); if (!list.length) return;
    const desc = list.map(i => `✅ ${i.text} (${i.itemTitle})`);
    const msg = `*Orçamento*\n\n${desc.join('\n')}\n\n*Total: R$ ${total.toFixed(2).replace('.', ',')}*`;
    navigator.clipboard.writeText(msg).then(() => { showToast('Orçamento global copiado!'); });
  });
  
  btnClearBudget.addEventListener('click', async () => {
    const { list } = getGlobalBudgetData(); if (!list.length) return;
    if (!confirm(`Isso vai desmarcar ${list.length} item(ns) de orçamento. Continuar?`)) return;
    const affectedIds = await clearAllBudgetCheckboxes();
    if (viewingItem && affectedIds.includes(viewingItem.id)) closeView();
    showToast('Orçamento limpo.'); refreshBudgetSummary(); renderCards();
  });

  // ==========================================
  // CARTUCHOS - EVENTOS DE CLIQUE E ARQUIVOS
  // ==========================================
  
  // A. Botão que abre a gaveta de Exportar
  btnExport.addEventListener('click', () => {
    if (typeof closeSheetEl === 'function') closeSheetEl(sheetMore);
    const allCats = [...new Set(allItems.map(i => i.category || 'Sem Categoria'))];
    cartridgeCategories.innerHTML = '';
    
    allCats.forEach(cat => {
      const lbl = document.createElement('label'); lbl.className = 'checkbox-row';
      lbl.style.display = 'flex'; lbl.style.alignItems = 'center'; lbl.style.gap = '8px'; lbl.style.padding = '6px 0'; lbl.style.cursor = 'pointer';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = cat; cb.checked = true; cb.style.width = '20px'; cb.style.height = '20px';
      const span = document.createElement('span'); span.textContent = cat;
      lbl.appendChild(cb); lbl.appendChild(span);
      cartridgeCategories.appendChild(lbl);
    });

    cartridgeName.value = ''; openSheet(modalExportCartridge); 
  });

  // B. Botão FINAL que filtra o BD e exporta o JSON (Preservando as imagens/áudios)
  btnConfirmExportCartridge.addEventListener('click', async () => {
    const checkboxes = Array.from(cartridgeCategories.querySelectorAll('input[type="checkbox"]:checked'));
    const selectedCats = checkboxes.map(cb => cb.value);
    if (selectedCats.length === 0) { showToast('Selecione pelo menos uma categoria!'); return; }

    closeSheetEl(modalExportCartridge);
    showToast('Processando cartucho... isso pode levar uns segundos.');

    // PRECISAMOS DO dbGetAll PARA PEGAR OS BLOBS (fotos e áudios que pesam na memória)
    const allHeavyItems = await dbGetAll();
    const dataToExport = allHeavyItems.filter(i => selectedCats.includes(i.category || 'Sem Categoria'));
    
    const serializable = [];
    for (const it of dataToExport){
      let photoBase64 = null, photoType = null;
      if (it.photo){ photoBase64 = await blobToDataURL(it.photo); photoType = it.photo.type || null; }
      let audioBase64 = null, audioType = null;
      if (it.audio){ audioBase64 = await blobToDataURL(it.audio); audioType = it.audio.type || null; }
      
      const copy = Object.assign({}, it);
      delete copy.photo; delete copy.audio;
      copy.photoBase64 = photoBase64; copy.photoType = photoType;
      copy.audioBase64 = audioBase64; copy.audioType = audioType;
      serializable.push(copy);
    }
    
    const payload = { app:'memorias', version:1, exportedAt: Date.now(), items: serializable };
    const blob = new Blob([JSON.stringify(payload)], { type:'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    
    const customName = cartridgeName.value.trim().replace(/\s+/g, '_'); 
    const dateStr = new Date().toISOString().slice(0,10);
    const filename = customName ? `cartucho_${customName}_${dateStr}.json` : `cartucho_memorias_${dateStr}.json`;
    
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    showToast(`Cartucho exportado! (${dataToExport.length} notas)`);
  });

  btnCloseExportCartridge.addEventListener('click', () => closeSheetEl(modalExportCartridge));

  // C. Ao selecionar o arquivo JSON, lê os dados e abre a gaveta de Importar
  fieldImport.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    try {
      const text = await file.text();
      const payload = JSON.parse(text);
      const items = Array.isArray(payload) ? payload : (payload.items || []);
      if (!items.length){ showToast('Nenhum registro encontrado no arquivo.'); fieldImport.value = ''; return; }
      
      pendingCartridgeItems = items; // Salva na memória 
      if (typeof closeSheetEl === 'function') closeSheetEl(sheetMore);
      openSheet(modalImportChoice);
    } catch(err){
      showToast('Arquivo inválido ou corrompido.');
    }
    fieldImport.value = '';
  });

  btnCloseImportChoice.addEventListener('click', () => {
    closeSheetEl(modalImportChoice); pendingCartridgeItems = null;
  });

  // D. Botão MESCLAR Cartucho
  btnImportMerge.addEventListener('click', async () => {
    if (!pendingCartridgeItems) return;
    closeSheetEl(modalImportChoice);
    showToast('Mesclando cartucho... aguarde.');
    const addedCount = await processCartridgeItems(pendingCartridgeItems);
    showToast(`${addedCount} registro(s) mesclado(s) com sucesso.`);
    pendingCartridgeItems = null; loadAndRender();
  });

  // E. Botão SUBSTITUIR TUDO
  btnImportReplace.addEventListener('click', async () => {
    if (!pendingCartridgeItems) return;
    if (!confirm(`Isso vai APAGAR TODAS as suas notas atuais e usar APENAS as ${pendingCartridgeItems.length} do cartucho. Tem Certeza?`)) return;
    
    closeSheetEl(modalImportChoice);
    showToast('Formatando e instalando cartucho... aguarde.');

    const currentItems = await dbGetAll();
    for (const it of currentItems) { await dbDelete(it.id); }

    const addedCount = await processCartridgeItems(pendingCartridgeItems);
    showToast(`Novo Cartucho Instalado! (${addedCount} registros)`);
    pendingCartridgeItems = null; loadAndRender();
  });

  // ==========================================

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (modalForm.classList.contains('open')) closeForm();
    else if (modalView.classList.contains('open')) closeView();
    else if (sheetSearch.classList.contains('open')) closeSheetEl(sheetSearch);
    else if (sheetCategory.classList.contains('open')) closeSheetEl(sheetCategory);
    else if (sheetMore.classList.contains('open')) closeSheetEl(sheetMore);
    else if (modalExportCartridge.classList.contains('open')) closeSheetEl(modalExportCartridge);
    else if (modalImportChoice.classList.contains('open')) closeSheetEl(modalImportChoice);
  });

  if (!SpeechRecognitionAPI){ document.querySelectorAll('.mic-btn').forEach(b => b.style.display = 'none'); }
  if (toggleGlobalAudio) {
    toggleGlobalAudio.checked = isAudioEnabled;
    toggleGlobalAudio.addEventListener('change', (e) => {
      isAudioEnabled = e.target.checked; localStorage.setItem('memorias_audio_global', isAudioEnabled);
      if (!isAudioEnabled && 'speechSynthesis' in window) { window.speechSynthesis.cancel(); }
      showToast(isAudioEnabled ? 'Áudio liberado.' : 'Modo Silencioso ativado.');
    });
  }
  if (toggleReadOptions) {
    toggleReadOptions.checked = readQuizOptions;
    toggleReadOptions.addEventListener('change', (e) => {
      readQuizOptions = e.target.checked; localStorage.setItem('memorias_read_options', readQuizOptions);
      showToast(readQuizOptions ? 'Lendo pergunta + alternativas.' : 'Lendo APENAS a pergunta.');
    });
  }
  if (toggleAutoReadNext) {
    toggleAutoReadNext.checked = autoReadNextQuiz;
    toggleAutoReadNext.addEventListener('change', (e) => {
      autoReadNextQuiz = e.target.checked; localStorage.setItem('memorias_auto_read_next', autoReadNextQuiz);
      showToast(autoReadNextQuiz ? 'Auto-leitura ligada.' : 'Auto-leitura desligada.');
    });
  }
  if (voiceSpeed) {
    voiceSpeed.value = currentVoiceSpeed; 
    const updateSpeedLabel = (val) => {
      if (val < 0.9) speedLabel.textContent = `Devagar (${val}x)`;
      else if (val > 1.1) speedLabel.textContent = `Rápido (${val}x)`;
      else speedLabel.textContent = `Normal (${val}x)`;
    };
    updateSpeedLabel(currentVoiceSpeed);
    voiceSpeed.addEventListener('input', (e) => { updateSpeedLabel(parseFloat(e.target.value)); });
    voiceSpeed.addEventListener('change', (e) => {
      currentVoiceSpeed = parseFloat(e.target.value); localStorage.setItem('memorias_voice_speed', currentVoiceSpeed);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel(); 
    });
  }
}

async function seedIfEmpty(){
  const items = await dbGetAllLight();
  if (items.length > 0) return;
  const now = Date.now();
  const examples = [
    { title:'Exemplo: torque do cabeçote (você pode apagar)', category:'Torque/Aperto', vehicle:'VW Gol 1.0 8V (motor AP)', spec:'9,5 kgf·m (95 Nm) + 1/4 de volta', content:'Sequência de aperto em cruz, em 3 etapas, sempre com o motor frio. Este é um registro de exemplo — edite ou apague quando quiser.', tags:['motor','cabecote','ap'], favorite:true, photo:null, useCount:0, createdAt:now, updatedAt:now },
    { title:'Exemplo: carro não pega só de manhã', category:'Diagnóstico', vehicle:'Honda Civic 2015 1.8', spec:'', content:'Causa encontrada: válvula do IAC suja, motor engasgando a frio. A limpeza resolveu. Vale checar esse componente antes de trocar sensor.', tags:['partida a frio','iac','injecao'], favorite:false, photo:null, useCount:0, createdAt:now, updatedAt:now },
    { title:'Exemplo: relé da bomba de combustível', category:'Componente', vehicle:'Fiat Palio 1.0 Fire', spec:'', content:'Fica na caixa de fusíveis do compartimento do motor, posição 3, relé azul.', tags:['combustivel','rele','fusivel'], favorite:false, photo:null, useCount:0, createdAt:now, updatedAt:now }
  ];
  for (const ex of examples) await dbAdd(ex);
}

/* ---------------- Início ---------------- */
(async function init(){
  setupEventListeners();
  await seedIfEmpty();
  await loadAndRender();
})();

})();
</script>
